name: Shared phone runtime contract
on:
  push:
    paths: ['runtime/**', '.github/workflows/shared-runtime.yml']
  pull_request:
    paths: ['runtime/**', '.github/workflows/shared-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S runtime -B /tmp/aether-runtime -DAETHER_RUNTIME_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build /tmp/aether-runtime --parallel 2
      - run: ctest --test-dir /tmp/aether-runtime --output-on-failure
      - name: Test SDK20 gate failure and evidence checks
        run: python3 -m unittest discover -s runtime/tests -p 'test_sdk20_gate.py' -v

  sdk20-napi:
    name: SDK20 N-API compile and link
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AETHER_SDK20_URL: ${{ vars.AETHER_SDK20_URL }}
      AETHER_SDK20_SHA256: ${{ vars.AETHER_SDK20_SHA256 }}
      SDK20_OUTPUT: ${{ runner.temp }}/aether-sdk20-evidence
    steps:
      - uses: actions/checkout@v4
      - name: Obtain the reviewed SDK20 archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from urllib.parse import urlsplit

          url = urlsplit(os.environ['AETHER_SDK20_URL'])
          digest = os.environ['AETHER_SDK20_SHA256']
          if url.scheme != 'https' or not url.hostname or url.username or url.password or url.fragment:
              raise SystemExit('SDK20 unverified: configure AETHER_SDK20_URL with a reviewed HTTPS SDK ZIP URL (no credentials).')
          if not re.fullmatch(r'[0-9a-fA-F]{64}', digest):
              raise SystemExit('SDK20 unverified: configure AETHER_SDK20_SHA256 with the reviewed archive SHA-256.')
          PY
          archive="$RUNNER_TEMP/aether-sdk20.zip"
          curl --proto '=https' --proto-redir '=https' --location --fail \
            --retry 2 --connect-timeout 30 --max-time 1200 \
            --output "$archive" "$AETHER_SDK20_URL"
          printf '%s  %s\n' "$AETHER_SDK20_SHA256" "$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/aether-sdk20"
          unzip -q "$archive" -d "$RUNNER_TEMP/aether-sdk20"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'aether-sdk20'
          candidates = []
          for metadata in root.rglob('oh-uni-package.json'):
              if metadata.parent.name != 'native':
                  continue
              data = json.loads(metadata.read_text())
              if str(data.get('apiVersion')) != '20':
                  continue
              native = metadata.parent.resolve()
              if not native.is_relative_to(root.resolve()):
                  raise SystemExit('SDK20 unverified: native directory escapes the extracted archive.')
              if not (native / 'build/cmake/ohos.toolchain.cmake').is_file():
                  raise SystemExit('SDK20 unverified: API20 native package lacks its OHOS CMake toolchain.')
              candidates.append(native)
          if len(candidates) != 1:
              raise SystemExit(f'SDK20 unverified: expected exactly one API20 native package; found {len(candidates)}.')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'AETHER_SDK20_NATIVE={candidates[0]}\n')
          PY
      - name: Compile both optional runtime libraries with SDK20
        id: sdk20_gate
        run: >-
          python3 runtime/tools/check_sdk20.py
          --native-sdk "$AETHER_SDK20_NATIVE"
          --output-dir "$SDK20_OUTPUT"
      - name: Record SDK20 evidence and validation scope
        if: always()
        env:
          SDK20_GATE_OUTCOME: ${{ steps.sdk20_gate.outcome }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ['SDK20_OUTPUT'])
          result_file = output / 'result.json'
          result = {}
          if result_file.is_file():
              print(result_file.read_text())
              try:
                  result = json.loads(result_file.read_text())
                  if not isinstance(result, dict):
                      raise ValueError('expected result object')
              except (ValueError, TypeError):
                  result = {}
                  print('SDK20 unverified: malformed result.json')
          for log in sorted(output.rglob('*.log')):
              print(f'\n--- {log.relative_to(output)} ---\n{log.read_text(errors="replace")}')
          passed = os.environ['SDK20_GATE_OUTCOME'] == 'success' and result.get('status') == 'passed'
          status = 'PASSED' if passed else 'UNVERIFIED / FAILED (see acquisition and gate logs)'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'### Optional SDK20 N-API gate\n\nSDK compile/link and ELF checks: **{status}**.\n\n')
              summary.write('Phone Core integration: **not tested**. Device execution: **not tested**. '
                            'Repeated startup / reentry: **not tested**; the existing one-shot contract remains.\n\n')
              summary.write('Host contract and gate fixture tests are separate checks. '
                            'The fullcore/API18 HAP and publication workflows are unchanged. '
                            'This job does not upload SDK files or binaries.\n')
          if not passed:
              raise SystemExit('SDK20 unverified: compile/link and ELF validation did not complete successfully.')
          PY
