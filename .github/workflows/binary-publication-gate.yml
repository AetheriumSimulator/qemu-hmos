name: Source prerequisites and legacy publication hold

on:
  workflow_call:
    outputs:
      allowed:
        description: Legacy binary jobs remain held; complete HAP pipeline verifies its built delivery separately
        value: ${{ jobs.review.outputs.allowed }}

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    outputs:
      allowed: ${{ steps.eligibility.outputs.allowed }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_public_source.py
      - run: python tools/check_source_inventory.py
      - id: eligibility
        run: |
          echo 'allowed=false' >> "$GITHUB_OUTPUT"
          echo '::notice::Source prerequisites passed. Legacy binary jobs remain held; the complete HAP pipeline evaluates its collected delivery evidence after building. See docs/OPEN_SOURCE_STATUS.md.'
